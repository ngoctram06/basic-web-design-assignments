<!DOCTYPE html>
<html>
<head>
    <title>Student Grade</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <div class="box">

        <h1 class="title">
            Student's Grade
        </h1>

        <div class="item">
            <label>Grade 1:</label>
            <input type="text" id="grade1">
        </div>

        <div class="item">
            <label>Grade 2:</label>
            <input type="text" id="grade2">
        </div>

        <div class="button">
            <button onclick="calculate()">Submit</button>
        </div>

        <div class="result">
            <label id="average">Average score:</label>
        </div>

        <div class="result">
            <label id="result">Grade:</label>
        </div>

    </div>

    <script src="content.js"></script>

</body>
</html>
