<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        sum = 0;
        sochan = 0;
            for(let i=0; i<6;i++){
                sum=sum+i;
                if (i%2==0){
                    sochan=sochan+i;
                }
            }
            // console.log(sochan);
            // console.log(sum);
            document.write("Tổng các số chẵn từ 0 đến 5 là: " + sochan + "<br>");
            document.write("Tổng các số từ 0 đến 5 là: " + sum);
    </script>
</body>
</html>
